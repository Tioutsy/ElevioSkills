<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="ELH-48: Smart Building Automation &amp; BMS Optimization">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Structural Grid Pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="60" cy="60" r="1.5" fill="rgba(255, 255, 255, 0.08)"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#glowGrad)"/>
  <rect width="1600" height="900" fill="url(#gridPattern)"/>

  <!-- Subtle Horizon / Diagonal Accent Geometry -->
  <path d="M -100 900 L 1700 650 L 1700 900 Z" fill="rgba(0, 0, 0, 0.35)"/>
  <path d="M -100 900 L 1700 750 L 1700 900 Z" fill="rgba(0, 0, 0, 0.2)"/>

  <!-- Specialized Vector Motif -->
  
      <!-- Built Environment & Smart Infrastructure Motif -->
      <g opacity="0.9">
        <!-- Isometric Building Silhouette -->
        <polygon points="1050,220 1220,140 1320,190 1150,270" fill="#38bdf8" opacity="0.5"/>
        <polygon points="1050,220 1150,270 1150,520 1050,470" fill="#7dd3fc" opacity="0.7"/>
        <polygon points="1150,270 1320,190 1320,440 1150,520" fill="#38bdf8" opacity="0.9"/>
        <!-- Window Grids & Smart Sensor Nodes -->
        <line x1="1180" y1="280" x2="1180" y2="480" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
        <line x1="1230" y1="260" x2="1230" y2="460" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
        <line x1="1280" y1="240" x2="1280" y2="440" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
        <circle cx="1220" cy="140" r="10" fill="#e0f2fe"/>
      </g>
    

  <!-- Brand Bar / Top Header -->
  <g transform="translate(100, 100)">
    <!-- Course Code Pill -->
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#38bdf8" opacity="0.95"/>
    <text x="65" y="27" fill="#022c22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1">ELH-48</text>

    <!-- Category Tag -->
    <rect x="145" y="0" width="340" height="42" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(125, 211, 252, 0.4)" stroke-width="1.5"/>
    <text x="165" y="27" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">Property, Buildings &amp; Facilities Management</text>
  </g>

  <!-- Course Title & Metadata Content (Left Block) -->
  <g transform="translate(100, 240)">
    <text x="0" y="60" fill="#ffffff" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="52" font-weight="bold" line-height="1.2">
      <tspan x="0" dy="0">Smart Building Automation</tspan>
      <tspan x="0" dy="64">&amp; BMS Optimization</tspan>
    </text>

    <!-- Sector / Pathway Sub-Badge -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5">
        Sector Focus: Built Environment &amp; Facilities
      </text>
      <text x="0" y="36" fill="rgba(255, 255, 255, 0.7)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
        ELEVIO Skills · Workplace Sustainability &amp; ESG Standards
      </text>
    </g>
  </g>

  <!-- Bottom Brand Footnote & Professional Accent Line -->
  <rect x="100" y="780" width="1400" height="2" fill="#38bdf8" opacity="0.3"/>
  <g transform="translate(100, 825)">
    <text x="0" y="0" fill="rgba(255, 255, 255, 0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      ELEVIO SKILLS CANONICAL CATALOGUE · 16:9 RESPONSIVE DISPLAY STANDARD
    </text>
    <text x="1400" y="0" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="end">
      1600 × 900 · VERIFIED
    </text>
  </g>
</svg>
