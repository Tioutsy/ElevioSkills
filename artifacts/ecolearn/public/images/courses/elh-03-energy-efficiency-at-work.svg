<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="ELH-03: Energy Efficiency at Work">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="60%" stop-color="#422006"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#422006" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Structural Grid Pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="60" cy="60" r="1.5" fill="rgba(255, 255, 255, 0.08)"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#glowGrad)"/>
  <rect width="1600" height="900" fill="url(#gridPattern)"/>

  <!-- Subtle Horizon / Diagonal Accent Geometry -->
  <path d="M -100 900 L 1700 650 L 1700 900 Z" fill="rgba(0, 0, 0, 0.35)"/>
  <path d="M -100 900 L 1700 750 L 1700 900 Z" fill="rgba(0, 0, 0, 0.2)"/>

  <!-- Specialized Vector Motif -->
  
      <!-- Energy & Thermodynamic Systems Motif -->
      <g opacity="0.9">
        <!-- Technical Grid & Circuit -->
        <line x1="850" y1="200" x2="1450" y2="200" stroke="#facc15" stroke-width="2" opacity="0.4" stroke-dasharray="10 5"/>
        <line x1="850" y1="350" x2="1450" y2="350" stroke="#facc15" stroke-width="2" opacity="0.4" stroke-dasharray="10 5"/>
        <line x1="850" y1="500" x2="1450" y2="500" stroke="#facc15" stroke-width="2" opacity="0.4" stroke-dasharray="10 5"/>
        <!-- Power Wave / Solar PV Cells / Turbine -->
        <rect x="950" y="240" width="420" height="260" rx="16" fill="url(#panelGrad)" stroke="#eab308" stroke-width="3"/>
        <line x1="1090" y1="240" x2="1090" y2="500" stroke="#facc15" stroke-width="2" opacity="0.6"/>
        <line x1="1230" y1="240" x2="1230" y2="500" stroke="#facc15" stroke-width="2" opacity="0.6"/>
        <line x1="950" y1="370" x2="1370" y2="370" stroke="#facc15" stroke-width="2" opacity="0.6"/>
        <!-- Energy Pulse Bolt -->
        <path d="M 1160 270 L 1130 350 L 1170 350 L 1140 440 L 1200 360 L 1160 360 Z" fill="#facc15" opacity="0.95"/>
      </g>
    

  <!-- Brand Bar / Top Header -->
  <g transform="translate(100, 100)">
    <!-- Course Code Pill -->
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#eab308" opacity="0.95"/>
    <text x="65" y="27" fill="#022c22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1">ELH-03</text>

    <!-- Category Tag -->
    <rect x="145" y="0" width="340" height="42" rx="8" fill="rgba(234, 179, 8, 0.2)" stroke="rgba(250, 204, 21, 0.4)" stroke-width="1.5"/>
    <text x="165" y="27" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">Foundations &amp; Core ESG</text>
  </g>

  <!-- Course Title & Metadata Content (Left Block) -->
  <g transform="translate(100, 240)">
    <text x="0" y="60" fill="#ffffff" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="52" font-weight="bold" line-height="1.2">
      <tspan x="0" dy="0">Energy Efficiency at Work</tspan>
      
    </text>

    <!-- Sector / Pathway Sub-Badge -->
    <g transform="translate(0, 100)">
      <text x="0" y="0" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5">
        Sector Focus: Workplace Fundamentals
      </text>
      <text x="0" y="36" fill="rgba(255, 255, 255, 0.7)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
        ELEVIO Skills · Workplace Sustainability &amp; ESG Standards
      </text>
    </g>
  </g>

  <!-- Bottom Brand Footnote & Professional Accent Line -->
  <rect x="100" y="780" width="1400" height="2" fill="#eab308" opacity="0.3"/>
  <g transform="translate(100, 825)">
    <text x="0" y="0" fill="rgba(255, 255, 255, 0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      ELEVIO SKILLS CANONICAL CATALOGUE · 16:9 RESPONSIVE DISPLAY STANDARD
    </text>
    <text x="1400" y="0" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="end">
      1600 × 900 · VERIFIED
    </text>
  </g>
</svg>
